aid: lawhive
name: Lawhive
description: >-
  Lawhive is a UK consumer legal-services marketplace that connects individuals and small businesses
  with regulated solicitors online at fixed, transparent prices, positioned as roughly half the cost
  of a traditional high-street law firm. Clients answer intake questions on the site, receive a quote
  or a callback, and are matched with a vetted consultant lawyer who then runs the matter end to end
  through the Lawhive platform, covering conveyancing, divorce and family, employment, immigration,
  landlord and tenant, and property work. Lawhive Ltd is not a law firm and does not give legal
  advice itself; regulated legal services are delivered by its network, including affiliate firm
  Lawhive Legal Ltd, which is authorised and regulated by the Solicitors Regulation Authority
  (SRA ID 8003766). The company is backed by Balderton Capital and GV. Lawhive publishes no public
  developer API, SDK, or API documentation, so this profile captures its identity, legal and
  compliance posture, and probed domain-security surface rather than an API contract.
